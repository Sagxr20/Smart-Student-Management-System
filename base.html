<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Student Management{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb}.sidebar{min-height:100vh;background:#18212f}.sidebar a{color:#d9e2ef;text-decoration:none;display:block;padding:12px 18px;border-radius:8px;margin:4px 0}.sidebar a:hover{background:#29384d}.brand{font-weight:700;font-size:20px}.card{border:0;border-radius:14px;box-shadow:0 4px 18px #0000000b}.stat{font-size:28px;font-weight:700}.table{vertical-align:middle}
</style>
</head>
<body>
<div class="container-fluid"><div class="row">
<aside class="col-md-2 sidebar p-3">
<div class="text-white brand mb-4">🎓 Smart Student</div>
<a href="{{url_for('dashboard')}}">📊 Dashboard</a>
<a href="{{url_for('students')}}">👨‍🎓 Students</a>
<a href="{{url_for('subjects')}}">📚 Subjects</a>
<a href="{{url_for('attendance')}}">📅 Attendance</a>
<a href="{{url_for('marks')}}">📝 Marks</a>
<a href="{{url_for('reports')}}">📈 Reports</a>
<hr class="border-secondary">
<a href="{{url_for('logout')}}">🚪 Logout</a>
</aside>
<main class="col-md-10 p-4">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,msg in messages %}<div class="alert alert-{{category}}">{{msg}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main></div></div>
</body></html>
