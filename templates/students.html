{% extends "base.html" %}{% block title %}Students{% endblock %}{% block content %}
<div class="d-flex justify-content-between mb-3"><h2>Students</h2><a class="btn btn-dark" href="{{url_for('add_student')}}">+ Add Student</a></div>
<form class="input-group mb-3"><input class="form-control" name="q" value="{{q}}" placeholder="Search by name, roll no or course"><button class="btn btn-outline-secondary">Search</button></form>
<div class="card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>Roll No</th><th>Name</th><th>Email</th><th>Course</th><th>Sem</th><th>Actions</th></tr></thead><tbody>
{% for s in students %}<tr><td>{{s.roll_no}}</td><td>{{s.name}}</td><td>{{s.email}}</td><td>{{s.course}}</td><td>{{s.semester or '-'}}</td><td>
<a class="btn btn-sm btn-outline-primary" href="{{url_for('edit_student',id=s.id)}}">Edit</a>
<form class="d-inline" method="post" action="{{url_for('delete_student',id=s.id)}}" onsubmit="return confirm('Delete this student?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>
{% else %}<tr><td colspan="6">No students found.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
