{% extends "base.html" %}{% block title %}Student{% endblock %}{% block content %}
<h2>{{'Edit' if student else 'Add'}} Student</h2><div class="card p-4 mt-3">
<form method="post"><div class="row g-3">
<div class="col-md-6"><label>Roll No</label><input class="form-control" name="roll_no" value="{{student.roll_no if student else ''}}" required></div>
<div class="col-md-6"><label>Name</label><input class="form-control" name="name" value="{{student.name if student else ''}}" required></div>
<div class="col-md-6"><label>Email</label><input class="form-control" type="email" name="email" value="{{student.email if student else ''}}"></div>
<div class="col-md-6"><label>Phone</label><input class="form-control" name="phone" value="{{student.phone if student else ''}}"></div>
<div class="col-md-6"><label>Course</label><input class="form-control" name="course" placeholder="BCA" value="{{student.course if student else ''}}"></div>
<div class="col-md-6"><label>Semester</label><input class="form-control" type="number" min="1" max="12" name="semester" value="{{student.semester if student else ''}}"></div>
</div><button class="btn btn-dark mt-4">Save</button> <a class="btn btn-light mt-4" href="{{url_for('students')}}">Cancel</a></form></div>{% endblock %}
